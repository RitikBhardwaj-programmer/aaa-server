# RADIUS clients (NAS) allowed to talk to this server. Each one has its own shared secret.
# Secrets come from .env through environment variables.

# Local tools inside the radius container (radtest, radclient)
client localhost {
	ipaddr = 127.0.0.1
	secret = $ENV{RADIUS_SECRET_LOCAL}
	shortname = localhost
	require_message_authenticator = auto
}

# The automated test container (docker-compose service "tests", fixed IP)
client test-runner {
	ipaddr = 10.89.0.50
	secret = $ENV{RADIUS_SECRET_LOCAL}
	shortname = test-runner
	require_message_authenticator = auto
}

# The access point: D-Link DIR-X6060.
# Docker Desktop on Windows rewrites the source address of every packet that arrives from the LAN
# to the Docker network gateway (10.89.0.1), so the AP's real IP (AP_IP) is never seen here.
# The shared secret is therefore the only thing that identifies the AP: keep it long and private.
# On a Linux host with host networking, change ipaddr to $ENV{AP_IP}.
client ap-dirx6060 {
	ipaddr = 10.89.0.1
	secret = $ENV{RADIUS_SECRET_AP}
	shortname = ap-dirx6060
	nas_type = other
	# 802.1X traffic always carries Message-Authenticator; requiring it blocks BlastRADIUS-style forgery
	require_message_authenticator = yes
	limit_proxy_state = yes
}
