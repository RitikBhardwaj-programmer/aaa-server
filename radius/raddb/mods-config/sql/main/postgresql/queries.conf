# -*- text -*-
# PostgreSQL queries for the AAA lab. Based on FreeRADIUS 3.2.10
# raddb/mods-config/sql/main/postgresql/queries.conf, with these changes:
#   - radacct is partitioned (postgres/initdb/02-schema.sql), and PostgreSQL does not allow
#     ON CONFLICT (AcctUniqueId) there. Each INSERT is therefore gated by radacct_claim(), and
#     rlm_sql runs the next query in the list when one changes 0 rows (stock behaviour).
#   - Times come from Event-Timestamp, which sites-available/default sets to the server's
#     receive time (AP clocks can be wrong: the lab AP reports 2024).
#   - post-auth never stores the password (the stock query stores User-Password) and records
#     the device MAC for the reject rate limit.
#   - Only accounting and post-auth queries: users are never looked up in SQL (LDAP is the
#     identity store), and the device limit uses its own query (policy.d/campus).

event_timestamp_epoch = "%{%{integer:Event-Timestamp}:-%l}"
event_timestamp = "TO_TIMESTAMP(${event_timestamp_epoch})"

accounting {
	reference = "%{tolower:type.%{%{Acct-Status-Type}:-%{Request-Processing-Stage}}.query}"

	column_list = "\
		AcctSessionId, AcctUniqueId, UserName, Realm, NASIPAddress, NASPortId, NASPortType, \
		AcctStartTime, AcctUpdateTime, AcctStopTime, AcctSessionTime, AcctAuthentic, \
		ConnectInfo_start, ConnectInfo_Stop, AcctInputOctets, AcctOutputOctets, \
		CalledStationId, CallingStationId, AcctTerminateCause, ServiceType, FramedProtocol, \
		FramedIpAddress, FramedIpv6Address, FramedIpv6Prefix, FramedInterfaceId, \
		DelegatedIpv6Prefix, Class"

	# Shared SELECT list for the "insert if missing" queries below
	values_common = "\
		'%{Acct-Session-Id}', \
		'%{Acct-Unique-Session-Id}', \
		'%{SQL-User-Name}', \
		NULLIF('%{Realm}', ''), \
		'%{%{NAS-IPv6-Address}:-%{NAS-IP-Address}}', \
		NULLIF('%{%{NAS-Port-ID}:-%{NAS-Port}}', ''), \
		'%{NAS-Port-Type}'"

	values_framed = "\
		'%{Called-Station-Id}', \
		'%{Calling-Station-Id}'"

	values_ip = "\
		'%{Service-Type}', \
		'%{Framed-Protocol}', \
		NULLIF('%{Framed-IP-Address}', '')::inet, \
		NULLIF('%{Framed-IPv6-Address}', '')::inet, \
		NULLIF('%{Framed-IPv6-Prefix}', '')::inet, \
		NULLIF('%{Framed-Interface-Id}', ''), \
		NULLIF('%{Delegated-IPv6-Prefix}', '')::inet, \
		NULLIF('%{string:&Class}', '')"

	octets = "\
		AcctInputOctets = (('%{%{Acct-Input-Gigawords}:-0}'::bigint << 32) + '%{%{Acct-Input-Octets}:-0}'::bigint), \
		AcctOutputOctets = (('%{%{Acct-Output-Gigawords}:-0}'::bigint << 32) + '%{%{Acct-Output-Octets}:-0}'::bigint)"

	octets_values = "\
		(('%{%{Acct-Input-Gigawords}:-0}'::bigint << 32) + '%{%{Acct-Input-Octets}:-0}'::bigint), \
		(('%{%{Acct-Output-Gigawords}:-0}'::bigint << 32) + '%{%{Acct-Output-Octets}:-0}'::bigint)"

	framed_update = "\
		FramedIPAddress = NULLIF('%{Framed-IP-Address}', '')::inet, \
		FramedIPv6Address = NULLIF('%{Framed-IPv6-Address}', '')::inet, \
		FramedIPv6Prefix = NULLIF('%{Framed-IPv6-Prefix}', '')::inet, \
		FramedInterfaceId = NULLIF('%{Framed-Interface-Id}', ''), \
		DelegatedIPv6Prefix = NULLIF('%{Delegated-IPv6-Prefix}', '')::inet"

	# One insert per session ID, even with concurrent writers (radacct_claim, postgres/migrations/001)
	claim = "WHERE radacct_claim('%{Acct-Unique-Session-Id}', ${..event_timestamp})"

	type {
		# A NAS restarted: close all its open sessions ("bulk update" strategy).
		# This also frees the device-limit slots of every user on that AP.
		accounting-on {
			query = "\
				UPDATE ${....acct_table1} \
				SET \
					AcctStopTime = ${....event_timestamp}, \
					AcctUpdateTime = ${....event_timestamp}, \
					AcctSessionTime = (${....event_timestamp_epoch} - EXTRACT(EPOCH FROM(AcctStartTime))), \
					AcctTerminateCause = '%{%{Acct-Terminate-Cause}:-NAS-Reboot}' \
				WHERE AcctStopTime IS NULL \
				AND NASIPAddress = '%{%{NAS-IPv6-Address}:-%{NAS-IP-Address}}' \
				AND AcctStartTime <= ${....event_timestamp}"
		}

		accounting-off {
			query = "${..accounting-on.query}"
		}

		start {
			# New session
			query = "\
				INSERT INTO ${....acct_table1} (${...column_list}) \
				SELECT ${...values_common}, \
					${....event_timestamp}, ${....event_timestamp}, NULL, 0, \
					'%{Acct-Authentic}', '%{Connect-Info}', NULL, 0, 0, \
					${...values_framed}, NULL, ${...values_ip} \
				${...claim}"

			# Duplicate Start for an open session: refresh its start time (stock behaviour)
			query = "\
				UPDATE ${....acct_table1} \
				SET \
					AcctStartTime = ${....event_timestamp}, \
					AcctUpdateTime = ${....event_timestamp}, \
					ConnectInfo_start = '%{Connect-Info}' \
				WHERE AcctUniqueId = '%{Acct-Unique-Session-Id}' \
				AND AcctStopTime IS NULL"
		}

		interim-update {
			query = "\
				UPDATE ${....acct_table1} \
				SET \
					${...framed_update}, \
					AcctSessionTime = %{%{Acct-Session-Time}:-NULL}, \
					AcctInterval = (${....event_timestamp_epoch} - EXTRACT(EPOCH FROM (COALESCE(AcctUpdateTime, AcctStartTime)))), \
					AcctUpdateTime = ${....event_timestamp}, \
					${...octets} \
				WHERE AcctUniqueId = '%{Acct-Unique-Session-Id}' \
				AND AcctStopTime IS NULL"

			# The reaper closed this session, but the device is still sending updates (for
			# example the spool replayed old records after a database outage): reopen it.
			# Only a reaped row, and only with a newer packet, so a real Stop is never undone.
			query = "\
				UPDATE ${....acct_table1} \
				SET \
					${...framed_update}, \
					AcctSessionTime = %{%{Acct-Session-Time}:-NULL}, \
					AcctInterval = (${....event_timestamp_epoch} - EXTRACT(EPOCH FROM (COALESCE(AcctUpdateTime, AcctStartTime)))), \
					AcctUpdateTime = ${....event_timestamp}, \
					AcctStopTime = NULL, \
					AcctTerminateCause = NULL, \
					${...octets} \
				WHERE AcctUniqueId = '%{Acct-Unique-Session-Id}' \
				AND AcctTerminateCause = 'Stale-Session-Reaped' \
				AND AcctStopTime < ${....event_timestamp}"

			# Start was lost: create the session, start time = now - session time
			query = "\
				INSERT INTO ${....acct_table1} (${...column_list}) \
				SELECT ${...values_common}, \
					TO_TIMESTAMP(${....event_timestamp_epoch} - %{%{Acct-Session-Time}:-0}), \
					${....event_timestamp}, NULL, %{%{Acct-Session-Time}:-NULL}, \
					'%{Acct-Authentic}', '%{Connect-Info}', NULL, ${...octets_values}, \
					${...values_framed}, NULL, ${...values_ip} \
				${...claim}"
		}

		stop {
			query = "\
				UPDATE ${....acct_table2} \
				SET \
					AcctStopTime = ${....event_timestamp}, \
					AcctUpdateTime = ${....event_timestamp}, \
					AcctSessionTime = COALESCE(%{%{Acct-Session-Time}:-NULL}, \
						(${....event_timestamp_epoch} - EXTRACT(EPOCH FROM(AcctStartTime)))), \
					${...octets}, \
					AcctTerminateCause = '%{Acct-Terminate-Cause}', \
					${...framed_update}, \
					ConnectInfo_stop = '%{Connect-Info}' \
				WHERE AcctUniqueId = '%{Acct-Unique-Session-Id}' \
				AND AcctStopTime IS NULL"

			# Start and interims were lost: create a closed session
			query = "\
				INSERT INTO ${....acct_table1} (${...column_list}) \
				SELECT ${...values_common}, \
					TO_TIMESTAMP(${....event_timestamp_epoch} - %{%{Acct-Session-Time}:-0}), \
					${....event_timestamp}, ${....event_timestamp}, \
					NULLIF('%{Acct-Session-Time}', '')::bigint, \
					'%{Acct-Authentic}', '%{Connect-Info}', NULL, ${...octets_values}, \
					${...values_framed}, '%{Acct-Terminate-Cause}', ${...values_ip} \
				${...claim}"

			# Stop for a session that is already closed (for example by the reaper): update it
			query = "\
				UPDATE ${....acct_table2} \
				SET \
					AcctStopTime = ${....event_timestamp}, \
					AcctUpdateTime = ${....event_timestamp}, \
					AcctSessionTime = COALESCE(%{%{Acct-Session-Time}:-NULL}, \
						(${....event_timestamp_epoch} - EXTRACT(EPOCH FROM(AcctStartTime)))), \
					${...octets}, \
					AcctTerminateCause = '%{Acct-Terminate-Cause}', \
					ConnectInfo_stop = '%{Connect-Info}' \
				WHERE AcctUniqueId = '%{Acct-Unique-Session-Id}'"
		}

		# No Acct-Status-Type: ignore the packet
		accounting {
			query = "SELECT true"
		}
	}
}

# One row per Access-Accept / Access-Reject. No password column.
post-auth {
	query = "\
		INSERT INTO ${..postauth_table} \
			(username, reply, CalledStationId, CallingStationId, authdate, Class) \
		VALUES(\
			'%{SQL-User-Name}', \
			'%{reply:Packet-Type}', \
			'%{Called-Station-Id}', \
			'%{Calling-Station-Id}', \
			NOW(), \
			NULLIF('%{string:&reply:Class}', ''))"
}
