# Android app (android/): lint, JVM unit tests, debug APK. No device or emulator is needed.
name: android

on:
  push:
    paths: ["android/**", ".github/workflows/android.yml"]
  pull_request:
    paths: ["android/**", ".github/workflows/android.yml"]

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    defaults:
      run:
        working-directory: android
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      # Caches Gradle and checks that gradle-wrapper.jar is an official one
      - uses: gradle/actions/setup-gradle@v4

      - name: Android SDK platform 37 and build tools
        run: |
          yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses > /dev/null
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" "platforms;android-37" "build-tools;36.0.0" > /dev/null

      - name: Lint, unit tests, debug APK
        run: ./gradlew --no-daemon lint testDebugUnitTest assembleDebug

      - name: Upload the debug APK
        uses: actions/upload-artifact@v4
        with:
          name: nits-wifi-debug-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error

      - name: Upload the lint and test reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: nits-wifi-reports
          path: |
            android/app/build/reports/
            android/app/build/test-results/
          if-no-files-found: ignore
