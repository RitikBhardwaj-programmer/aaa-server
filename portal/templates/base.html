<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{% block title %}Wi-Fi account{% endblock %} - NIT Srinagar</title>
  <link rel="stylesheet" href="{{ url_for('static', filename='portal.css') }}">
</head>
<body>
  <header>
    <span class="brand">NIT Srinagar Wi-Fi</span>
    {% if session.uid %}
    <nav aria-label="Main">
      <a href="{{ url_for('devices') }}">My devices</a>
      <a href="{{ url_for('password') }}">Change password</a>
      <form method="post" action="{{ url_for('logout') }}" class="inline">
        <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">
        <button type="submit" class="link">Log out ({{ session.uid }})</button>
      </form>
    </nav>
    {% endif %}
  </header>
  <main>
    {% with messages = get_flashed_messages(with_categories=true) %}
      {% for category, message in messages %}
        <p class="note {{ category }}" role="status">{{ message }}</p>
      {% endfor %}
    {% endwith %}
    {% block content %}{% endblock %}
  </main>
</body>
</html>
